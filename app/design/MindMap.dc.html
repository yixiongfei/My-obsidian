      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-top: 1px solid #22242A; border-bottom: 1px solid #22242A; border-left: 2px solid transparent; color: #8B8F98;">
        <span style="font-size: 10px; letter-spacing: 0.14em; color: #5C606A; width: 14px;">04</span><span style="font-size: 13px;">日程</span>

    </div>

    <div style="width: 1px; flex: 1; background: #22242A;"></div>
    <div style="writing-mode: vertical-rl; flex: none; font-size: 10px; letter-spacing: 0.2em; color: #3A3D45; white-space: nowrap;">15 NOTES</div>
