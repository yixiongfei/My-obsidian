<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027考研倒计时</title>
<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#24243e;
    --bg3:#302b63;
    --accent1:#ffd166;
    --accent2:#ef476f;
    --accent3:#06d6a0;
    --text:#f5f3ff;
    --text-dim:#b8b3d9;
    --card:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg3) 45%,var(--bg2));
    background-attachment:fixed;
    color:var(--text);
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(239,71,111,0.18), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(255,209,102,0.15), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(6,214,160,0.12), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:920px;
    margin:0 auto;
    padding:36px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header .badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    background:rgba(255,209,102,0.12);
    border:1px solid rgba(255,209,102,0.35);
    color:var(--accent1);
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:14px;
  }
  header h1{
    margin:0;
    font-size:30px;
    font-weight:700;
    letter-spacing:1px;
  }
  header p{
    margin:8px 0 0;
    color:var(--text-dim);
    font-size:14px;
  }

  .hero{
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:28px;
    padding:40px 24px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    margin-bottom:24px;
  }
  .hero .num{
    font-size:clamp(64px,16vw,120px);
    font-weight:800;
    line-height:1;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:2px;
  }
  .hero .unit{
    font-size:20px;
    color:var(--text-dim);
    margin-top:4px;
    letter-spacing:4px;
  }
  .hero .sub{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    color:var(--text-dim);
    font-size:14px;
  }
  .hero .sub b{
    color:var(--text);
    font-size:16px;
  }

  .progress-card{
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:20px 24px;
    margin-bottom:24px;
  }
  .progress-card .row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .progress-bar-bg{
    width:100%;
    height:12px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--accent3),var(--accent1),var(--accent2));
    width:0%;
    transition:width 1s ease;
  }

  .cal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:24px;
  }
  @media (max-width:640px){
    .cal-grid{grid-template-columns:1fr;}
  }
  .cal-card{
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:18px 18px 22px;
  }
  .cal-card h3{
    margin:0 0 14px;
    font-size:15px;
    font-weight:600;
    text-align:center;
    color:var(--text);
    letter-spacing:1px;
  }
  .cal-card h3 span{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    font-weight:400;
    margin-top:2px;
  }
  table.cal{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  table.cal th{
    font-size:11px;
    color:var(--text-dim);
    font-weight:500;
    padding-bottom:8px;
  }
  table.cal td{
    text-align:center;
    padding:0;
    height:34px;
    font-size:13px;
    color:var(--text);
    position:relative;
  }
  table.cal td.empty{color:transparent;}
  table.cal td .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    width:28px;height:28px;
    margin:0 auto;
    border-radius:50%;
  }
  table.cal td.today .cell{
    background:linear-gradient(135deg,var(--accent3),#0aa87f);
    color:#04241b;
    font-weight:700;
    box-shadow:0 0 0 3px rgba(6,214,160,0.25);
  }
  table.cal td.examday .cell{
    background:linear-gradient(135deg,var(--accent2),#c81e51);
    color:#fff;
    font-weight:700;
    box-shadow:0 0 0 3px rgba(239,71,111,0.3);
  }

  .dots-card{
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(14px);
    border-radius:20px;
    padding:20px 24px 24px;
    margin-bottom:24px;
  }
  .dots-card h3{
    margin:0 0 4px;
    font-size:15px;
    font-weight:600;
  }
  .dots-card p{
    margin:0 0 14px;
    font-size:12px;
    color:var(--text-dim);
  }
  .dots{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(11px,1fr));
    gap:5px;
  }
  .dot{
    aspect-ratio:1/1;
    border-radius:3px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.08);
  }
  .dot.passed{
    background:linear-gradient(135deg,var(--accent3),var(--accent1));
    border-color:transparent;
  }
  .dot.today-dot{
    background:linear-gradient(135deg,var(--accent2),#c81e51);
    border-color:transparent;
    box-shadow:0 0 6px rgba(239,71,111,0.7);
  }
  .legend{
    display:flex;
    gap:18px;
    margin-top:14px;
    font-size:11px;
    color:var(--text-dim);
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    line-height:1.9;
    margin-top:10px;
  }
  footer .quote{
    font-size:15px;
    color:var(--text);
    margin-bottom:6px;
    font-style:italic;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">MISSION 2027 · 考研上岸计划</div>
    <h1>距离 2027 年考研初试</h1>
    <p id="dateLine">加载中…</p>
  </header>

  <div class="hero">
    <div class="num" id="daysLeft">--</div>
    <div class="unit">天</div>
    <div class="sub">
      <div><b id="weeksLeft">--</b> 周</div>
      <div><b id="monthsLeft">--</b> 个月</div>
      <div><b id="percentLeft">--</b> 备考进度</div>
    </div>
  </div>

  <div class="progress-card">
    <div class="row">
      <span id="startLabel">开始日</span>
      <span id="examLabel">初试日</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="cal-grid">
    <div class="cal-card" id="calThisMonth"></div>
    <div class="cal-card" id="calExamMonth"></div>
  </div>

  <div class="dots-card">
    <h3>备考进度日历</h3>
    <p>每一格代表一天，点亮的格子代表已经走过的日子，坚持住 💪</p>
    <div class="dots" id="dotsGrid"></div>
    <div class="legend">
      <span><i style="background:linear-gradient(135deg,var(--accent3),var(--accent1))"></i>已过去</span>
      <span><i style="background:linear-gradient(135deg,var(--accent2),#c81e51)"></i>今天</span>
      <span><i style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15)"></i>还未到来</span>
    </div>
  </div>

  <footer>
    <div class="quote" id="quote">"不必等到万事俱备，先出发，路会在脚下延伸。"</div>
    <div>每次打开本页面会自动重新计算天数，请放心收藏。</div>
    <div>页面生成于 2026-07-30 · 目标：2027-12-21 考研初试</div>
  </footer>

</div>

<script>
  // ---- 基础配置 ----
  const START = new Date(2026, 6, 30);   // 备考起点：2026-07-30
  const EXAM  = new Date(2027, 11, 21);  // 初试日：2027-12-21

  const WEEKDAYS = ['一','二','三','四','五','六','日'];
  const QUOTES = [
    '"不必等到万事俱备，先出发，路会在脚下延伸。"',
    '"每一天的坚持，都是未来的自己在偷偷谢谢现在的你。"',
    '"考研不是一场冲刺，而是一场有计划的耐力赛。"',
    '"你今天的努力，会变成拆封录取通知书那天的喜悦。"',
    '"慢慢来，比较快。"',
    '"过程很苦，结果很甜，坚持到底。"'
  ];

  function stripTime(d){
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function daysBetween(a,b){
    return Math.round((stripTime(b) - stripTime(a)) / 86400000);
  }
  function fmt(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function isSameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  const today = stripTime(new Date());
  const totalPeriod = daysBetween(START, EXAM);           // 全程总天数
  const elapsed = Math.max(0, daysBetween(START, today));  // 已经过去天数
  const daysLeft = daysBetween(today, EXAM);                // 剩余天数
  const percent = Math.min(100, Math.max(0, (elapsed/totalPeriod)*100));

  document.getElementById('dateLine').textContent =
    '今天 ' + fmt(today) + '　→　初试 ' + fmt(EXAM);

  document.getElementById('daysLeft').textContent = daysLeft >= 0 ? daysLeft : 0;
  document.getElementById('weeksLeft').textContent = Math.max(0, Math.floor(daysLeft/7));
  document.getElementById('monthsLeft').textContent = Math.max(0, Math.round(daysLeft/30.44*10)/10);
  document.getElementById('percentLeft').textContent = percent.toFixed(1)+'%';
  document.getElementById('startLabel').textContent = '起点 ' + fmt(START);
  document.getElementById('examLabel').textContent = '初试 ' + fmt(EXAM);
  document.getElementById('progressFill').style.width = percent+'%';
  document.getElementById('quote').textContent = QUOTES[today.getDate() % QUOTES.length];

  // ---- 月历生成 ----
  function buildMonthCalendar(container, year, month, opts){
    opts = opts || {};
    const first = new Date(year, month, 1);
    const startWeekday = (first.getDay()+6)%7; // 周一=0
    const daysInMonth = new Date(year, month+1, 0).getDate();

    let html = '<h3>'+year+'年'+(month+1)+'月<span>'+(opts.subtitle||'')+'</span></h3>';
    html += '<table class="cal"><thead><tr>';
    WEEKDAYS.forEach(w=> html += '<th>'+w+'</th>');
    html += '</tr></thead><tbody><tr>';

    for(let i=0;i<startWeekday;i++) html += '<td class="empty">·</td>';

    let col = startWeekday;
    for(let day=1;day<=daysInMonth;day++){
      const cellDate = new Date(year, month, day);
      let cls = '';
      if(isSameDay(cellDate, today)) cls = 'today';
      else if(isSameDay(cellDate, EXAM)) cls = 'examday';
      html += '<td class="'+cls+'"><div class="cell">'+day+'</div></td>';
      col++;
      if(col%7===0 && day!==daysInMonth) html += '</tr><tr>';
    }
    while(col%7!==0){ html += '<td class="empty">·</td>'; col++; }
    html += '</tr></tbody></table>';
    container.innerHTML = html;
  }

  buildMonthCalendar(document.getElementById('calThisMonth'), today.getFullYear(), today.getMonth(), {subtitle:'本月'});
  buildMonthCalendar(document.getElementById('calExamMonth'), EXAM.getFullYear(), EXAM.getMonth(), {subtitle:'初试月'});

  // ---- 进度点阵 ----
  const dotsGrid = document.getElementById('dotsGrid');
  const frag = document.createDocumentFragment();
  for(let i=0;i<=totalPeriod;i++){
    const d = document.createElement('div');
    const cellDate = new Date(START); cellDate.setDate(START.getDate()+i);
    d.className = 'dot' + (isSameDay(cellDate, today) ? ' today-dot' : (i < elapsed ? ' passed' : ''));
    d.title = fmt(cellDate);
    frag.appendChild(d);
  }
  dotsGrid.appendChild(frag);
</script>
</body>
</html>
