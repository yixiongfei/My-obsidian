# 打 v* 标签就在 GitHub 上自动打包 Windows 安装包，并挂到同名 Release 下。
# 本地不用再上传 100MB 的 exe：
#   git tag v1.0.1 && git push origin v1.0.1
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # vite build → dist-web/，再由 electron-builder 打成 nsis 安装包（只打包，不用它自带的发布器）
      - run: npm run build
      - run: npx electron-builder --win --publish never
        env:
          DEBUG: electron-builder

      # 挂到与标签同名的 Release（没有就建）；exe 与 blockmap 一起传，便于以后做增量更新
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml
          fail_on_unmatched_files: false
          generate_release_notes: true
