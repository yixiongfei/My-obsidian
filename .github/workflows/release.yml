# 打 v* 标签就在 GitHub 上自动打包 Windows 安装包，并挂到同名 Release 下。
# 本地不用再上传 100MB 的 exe：
#   git tag v1.0.1 && git push origin v1.0.1
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # vite build → dist-web/，再由 electron-builder 打成 nsis 安装包并直接发布到 Release
      - run: npm run build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
